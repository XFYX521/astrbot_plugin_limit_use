<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>用户管理 · 对话次数限制</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --border: #e8eaf0;
      --text: #1f2430;
      --muted: #7b8190;
      --primary: #6366f1;
      --primary-soft: #eef0ff;
      --pos: #16a34a;
      --neg: #dc2626;
      --shadow: 0 1px 3px rgba(24, 29, 45, 0.06);
    }
    [data-theme="dark"] {
      --bg: #12141c;
      --card: #1b1e28;
      --border: #2a2e3c;
      --text: #e7e9f0;
      --muted: #9aa0b0;
      --primary: #818cf8;
      --primary-soft: #262a3d;
      --pos: #4ade80;
      --neg: #f87171;
      --shadow: none;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header .sub { color: var(--muted); font-size: 13px; }
    header .actions { margin-left: auto; display: flex; gap: 8px; }
    .btn {
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: 0.15s;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { filter: brightness(1.05); color: #fff; }

    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin-bottom: 18px;
    }
    .stat {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; box-shadow: var(--shadow);
    }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; letter-spacing: -0.3px; }

    .panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .panel-head {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .panel-head .title { font-size: 15px; font-weight: 700; }
    .panel-head .actions { margin-left: auto; display: flex; gap: 8px; }
    .search {
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: 8px; padding: 7px 12px; font-size: 13px; outline: none; min-width: 180px;
    }
    .search:focus { border-color: var(--primary); }

    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td { padding: 11px 16px; text-align: left; font-size: 13px; }
    th {
      color: var(--muted); font-weight: 600; font-size: 12px;
      background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    td { border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--primary-soft); }
    .uid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    .num { font-variant-numeric: tabular-nums; font-weight: 600; }
    .muted { color: var(--muted); }

    .remark { cursor: pointer; padding: 2px 6px; border-radius: 6px; display: inline-block; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .remark:hover { background: var(--primary-soft); }
    .remark.empty { color: var(--muted); font-style: italic; }
    .remark-input { padding: 4px 8px; border: 1px solid var(--primary); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; width: 130px; outline: none; }

    .stepper { display: inline-flex; align-items: center; gap: 4px; }
    .stepper button {
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer; font-size: 12px; font-weight: 700;
    }
    .stepper button:hover { border-color: var(--primary); color: var(--primary); }
    .stepper .val { min-width: 34px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

    .empty { padding: 44px 20px; text-align: center; color: var(--muted); font-size: 14px; }
    .toast {
      position: fixed; top: 18px; right: 18px; z-index: 99;
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px;
      font-size: 13px; opacity: 0; transform: translateY(-6px); transition: 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.error { background: var(--neg); color: #fff; }
    @media (max-width: 640px) {
      body { padding: 14px; }
      header h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>用户管理</h1>
        <div class="sub" id="subtitle">对话次数限制 · 用户额度与用量</div>
      </div>
      <div class="actions">
        <button class="btn" id="btnRefresh">刷新</button>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="panel">
      <div class="panel-head">
        <span class="title">用户列表</span>
        <div class="actions">
          <input class="search" id="search" placeholder="搜索 QQ 号 / 备注" />
        </div>
      </div>
      <div class="table-scroll">
        <div id="tableWrap"><div class="empty">加载中…</div></div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    const bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
    await bridge.ready();

    const $ = (id) => document.getElementById(id);
    const statsEl = $('stats');
    const tableWrap = $('tableWrap');
    const searchInput = $('search');
    const toastEl = $('toast');

    let usersData = [];
    let meta = {};
    let keyword = '';

    function toast(msg, isError = false) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value == null ? '' : String(value);
      return div.innerHTML;
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmtTokens(n) {
      n = Number(n) || 0;
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return String(n);
    }

    async function load() {
      tableWrap.innerHTML = '<div class="empty">加载中…</div>';
      try {
        const res = await bridge.apiGet('users');
        usersData = res.users || [];
        meta = {
          today_tokens_sum: res.today_tokens_sum || 0,
          total_tokens_sum: res.total_tokens_sum || 0,
        };
        renderStats();
        renderTable();
      } catch (e) {
        tableWrap.innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message || e)}</div>`;
      }
    }

    function renderStats() {
      const total = usersData.length;
      const usedSum = usersData.reduce((s, u) => s + (Number(u.total_used) || 0), 0);
      const remainSum = usersData.reduce((s, u) => s + (Number(u.remaining) || 0), 0);
      const items = [
        ['用户总数', total],
        ['累积调用', usedSum],
        ['剩余总次数', remainSum],
        ['累积 Token', fmtTokens(meta.total_tokens_sum)],
        ['今日 Token', fmtTokens(meta.today_tokens_sum)],
      ];
      statsEl.innerHTML = items.map(([label, value]) => `
        <div class="stat"><div class="label">${label}</div><div class="value">${escapeHtml(value)}</div></div>
      `).join('');
    }

    function renderTable() {
      const list = usersData
        .filter((u) => {
          if (!keyword) return true;
          const text = `${u.user_id} ${u.remark || ''}`.toLowerCase();
          return text.includes(keyword);
        })
        .sort((a, b) => (Number(b.total_tokens) || 0) - (Number(a.total_tokens) || 0));

      if (!list.length) {
        tableWrap.innerHTML = `<div class="empty">${usersData.length ? '没有匹配的用户' : '暂无用户数据'}</div>`;
        return;
      }

      const rows = list.map((u) => {
        const uid = escapeAttr(u.user_id);
        const remark = u.remark
          ? `<span class="remark" title="点击编辑备注">${escapeHtml(u.remark)}</span>`
          : `<span class="remark empty">+ 备注</span>`;
        return `<tr data-uid="${uid}">
          <td class="uid">${escapeHtml(u.user_id)}</td>
          <td class="td-remark">${remark}</td>
          <td><div class="stepper">
            <button data-delta="-10" title="-10">−</button>
            <span class="val td-remain">${Number(u.remaining) || 0}</span>
            <button data-delta="10" title="+10">＋</button>
          </div></td>
          <td class="num">${Number(u.today_used) || 0}</td>
          <td class="num">${Number(u.total_used) || 0}</td>
          <td class="num">${fmtTokens(u.total_tokens)}</td>
          <td><div class="stepper">
            <button data-delta="-1">−1</button>
            <button data-delta="1">+1</button>
          </div></td>
        </tr>`;
      }).join('');

      tableWrap.innerHTML = `<table>
        <thead><tr>
          <th>QQ 号</th><th>备注</th><th>剩余次数</th>
          <th>今日调用</th><th>累积调用</th><th>累积 Token</th><th>调整</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;

      tableWrap.querySelectorAll('.td-remark').forEach((el) => el.addEventListener('click', () => editRemark(el)));
      tableWrap.querySelectorAll('[data-delta]').forEach((btn) => btn.addEventListener('click', () => adjustQuota(btn)));
    }

    async function adjustQuota(btn) {
      const tr = btn.closest('tr');
      const uid = tr.dataset.uid;
      const delta = Number(btn.dataset.delta);
      const valEl = tr.querySelector('.td-remain');
      const next = Math.max(0, (Number(valEl.textContent) || 0) + delta);
      if (next === Number(valEl.textContent)) return;
      btn.disabled = true;
      try {
        const res = await bridge.apiGet(`update/${uid}/${next}`);
        valEl.textContent = res.remaining;
        toast('已更新');
      } catch (e) {
        toast(`操作失败：${e.message || e}`, true);
      } finally {
        btn.disabled = false;
      }
    }

    function editRemark(td) {
      const tr = td.closest('tr');
      const uid = tr.dataset.uid;
      const old = td.querySelector('.remark') ? td.querySelector('.remark').textContent : '';

      td.innerHTML = '<input class="remark-input" placeholder="备注" maxlength="20" />';
      const input = td.querySelector('input');
      input.value = old;
      input.focus();
      input.select();

      let done = false;
      async function finish(save) {
        if (done) return;
        done = true;
        const text = input.value.trim();
        if (!save) { renderTable(); return; }
        try {
          await bridge.apiGet(`remark/${uid}`, { text });
          const target = usersData.find((u) => String(u.user_id) === String(uid));
          if (target) target.remark = text;
          toast(text ? '备注已保存' : '备注已清除');
        } catch (e) {
          toast(`保存失败：${e.message || e}`, true);
        }
        renderTable();
      }
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      });
      input.addEventListener('blur', () => finish(true));
    }

    searchInput.addEventListener('input', () => {
      keyword = searchInput.value.trim().toLowerCase();
      renderTable();
    });
    $('btnRefresh').addEventListener('click', async () => { await load(); toast('已刷新'); });

    load();
  </script>
</body>
</html>
