<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>插件管理 · 对话次数限制</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --border: #e8eaf0;
      --text: #1f2430;
      --muted: #7b8190;
      --primary: #6366f1;
      --primary-soft: #eef0ff;
      --pos: #16a34a;
      --pos-soft: #e8f7ee;
      --neg: #dc2626;
      --neg-soft: #fdecec;
      --shadow: 0 1px 3px rgba(24, 29, 45, 0.06);
    }
    [data-theme="dark"] {
      --bg: #12141c;
      --card: #1b1e28;
      --border: #2a2e3c;
      --text: #e7e9f0;
      --muted: #9aa0b0;
      --primary: #818cf8;
      --primary-soft: #262a3d;
      --pos: #4ade80;
      --pos-soft: #1c3326;
      --neg: #f87171;
      --neg-soft: #3a1f24;
      --shadow: none;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    header h1 { font-size: 20px; font-weight: 700; }
    header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    header .actions { margin-left: auto; display: flex; gap: 8px; }
    .btn {
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.15s;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }

    .tabs {
      display: flex; gap: 6px; margin-bottom: 18px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 5px; box-shadow: var(--shadow); width: fit-content; max-width: 100%;
    }
    .tab {
      border: none; background: transparent; color: var(--muted); cursor: pointer;
      border-radius: 7px; padding: 8px 18px; font-size: 13px; font-weight: 600; transition: 0.15s;
    }
    .tab:hover { color: var(--primary); }
    .tab.active { background: var(--primary); color: #fff; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; letter-spacing: -0.3px; }
    .stat .value.pos { color: var(--pos); }
    .stat .value.neg { color: var(--neg); }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
    .panel + .panel { margin-top: 16px; }
    .panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .panel-head .title { font-size: 15px; font-weight: 700; }
    .panel-head .actions { margin-left: auto; display: flex; gap: 8px; }
    .panel-head .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
    .panel-head .toggle {
      display: flex; align-items: center; gap: 8px; padding: 0; border: none;
      background: none; color: inherit; font: inherit; cursor: pointer; user-select: none;
    }
    .panel-head .toggle:hover .title { color: var(--primary); }
    .panel-head .toggle .caret { color: var(--muted); font-size: 11px; transition: transform 0.15s; }
    .panel-head .count { color: var(--muted); font-size: 12px; font-weight: 600; }
    .panel.collapsed .panel-head { border-bottom-color: transparent; }
    .panel.collapsed .toggle .caret { transform: rotate(-90deg); }
    .panel.collapsed .panel-body { display: none; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-del:hover { border-color: var(--neg); color: var(--neg); }
    .search { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 13px; outline: none; min-width: 180px; }
    .search:focus { border-color: var(--primary); }

    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td { padding: 11px 16px; text-align: left; font-size: 13px; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--primary-soft); }
    .uid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    .num { font-variant-numeric: tabular-nums; font-weight: 600; }
    .pos { color: var(--pos); }
    .neg { color: var(--neg); }
    .muted { color: var(--muted); }

    .qty {
      width: 84px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg); color: var(--text); font-size: 13px; font-weight: 700;
      text-align: center; font-variant-numeric: tabular-nums; outline: none;
    }
    .qty:focus { border-color: var(--primary); background: var(--card); }
    .qty.saving { opacity: 0.6; }

    .danger { margin-top: 16px; border-color: var(--neg); }
    .danger .panel-head .title { color: var(--neg); }
    .btn-danger { border-color: var(--neg); color: var(--neg); }
    .btn-danger:hover { background: var(--neg); color: #fff; border-color: var(--neg); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { filter: brightness(1.05); color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .modal-mask {
      position: fixed; inset: 0; z-index: 90; background: rgba(15, 18, 30, 0.5);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-mask[hidden] { display: none; }
    .modal { width: 100%; max-width: 420px; background: var(--card); border-radius: 12px; padding: 20px 22px; box-shadow: 0 12px 40px rgba(15, 18, 30, 0.25); }
    .modal h3 { font-size: 16px; margin-bottom: 8px; }
    .modal p { color: var(--muted); font-size: 13px; line-height: 1.7; }
    .modal .modal-input { width: 100%; margin: 14px 0; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
    .modal .modal-input:focus { border-color: var(--neg); }
    .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    .market { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .asset { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .asset::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--primary); }
    .asset .name { font-size: 14px; font-weight: 700; color: var(--muted); }
    .asset .price { font-size: 26px; font-weight: 700; margin: 6px 0 3px; letter-spacing: -0.5px; }
    .asset .base { font-size: 12px; color: var(--muted); }
    .badge { position: absolute; top: 14px; right: 14px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
    .badge.pos { background: var(--pos-soft); color: var(--pos); }
    .badge.neg { background: var(--neg-soft); color: var(--neg); }

    .empty { padding: 44px 20px; text-align: center; color: var(--muted); font-size: 14px; }
    .toast {
      position: fixed; top: 18px; right: 18px; z-index: 99;
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px;
      font-size: 13px; opacity: 0; transform: translateY(-6px); transition: 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.error { background: var(--neg); color: #fff; }
    .view[hidden] { display: none; }
    @media (max-width: 640px) {
      body { padding: 14px; }
      header h1 { font-size: 18px; }
      .tab { padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>对话次数限制</h1>
        <div class="sub" id="subtitle">用户额度与模拟行情投资</div>
      </div>
      <div class="actions">
        <button class="btn" id="btnRefresh">刷新</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" data-view="users" aria-selected="true">用户管理</button>
      <button class="tab" role="tab" data-view="invest" aria-selected="false">行情与投资</button>
    </nav>

    <section class="view" id="view-users">
      <section class="stats" id="stats"></section>

      <section class="panel" id="panel-groups">
        <div class="panel-head">
          <button class="toggle" type="button" data-panel="groups" aria-expanded="true">
            <span class="caret">▼</span>
            <span class="title">群聊</span>
            <span class="count" id="groupCount"></span>
          </button>
          <span class="hint">同一用户在私聊与各群共用一份额度</span>
        </div>
        <div class="panel-body">
          <div class="table-scroll">
            <div id="groupWrap"><div class="empty">加载中…</div></div>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-private">
        <div class="panel-head">
          <button class="toggle" type="button" data-panel="private" aria-expanded="true">
            <span class="caret">▼</span>
            <span class="title">私聊</span>
            <span class="count" id="privateCount"></span>
          </button>
          <div class="actions">
            <input class="search" id="search" placeholder="搜索昵称 / QQ 号 / 群号" />
          </div>
        </div>
        <div class="panel-body">
          <div class="table-scroll">
            <div id="privateWrap"><div class="empty">加载中…</div></div>
          </div>
        </div>
      </section>

      <section class="panel danger">
        <div class="panel-head">
          <span class="title">危险操作</span>
          <div class="actions">
            <button class="btn btn-danger" id="btnClearAll">清空全部数据</button>
          </div>
        </div>
        <div style="padding: 12px 16px;" class="muted">
          删除所有用户的额度、签到、调用统计、Token、投资记录与昵称档案，操作不可恢复。
        </div>
      </section>
    </section>

    <section class="view" id="view-invest" hidden>
      <section class="market" id="market"></section>
      <section class="stats" id="investStats"></section>

      <section class="panel">
        <div class="panel-head">
          <span class="title">投资记录</span>
          <span class="hint" id="feeHint"></span>
        </div>
        <div class="table-scroll">
          <div id="investTableWrap"><div class="empty">加载中…</div></div>
        </div>
      </section>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-mask" id="clearModal" hidden>
    <div class="modal">
      <h3>清空全部数据</h3>
      <p>将删除所有用户的额度、签到、调用统计、Token、投资记录与昵称档案，且无法恢复。<br />请输入「清空」以确认。</p>
      <input class="modal-input" id="clearConfirmInput" placeholder="输入 清空" autocomplete="off" />
      <div class="modal-actions">
        <button class="btn" id="clearCancel">取消</button>
        <button class="btn btn-danger" id="clearConfirm" disabled>确认清空</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="delUserModal" hidden>
    <div class="modal">
      <h3>删除用户数据</h3>
      <p id="delUserText">将删除该用户的全部数据，且无法恢复。</p>
      <div class="modal-actions">
        <button class="btn" id="delCancel">取消</button>
        <button class="btn btn-danger" id="delConfirm">确认删除</button>
      </div>
    </div>
  </div>

  <script type="module">
    const bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
    if (!bridge) {
      document.body.innerHTML = '<div class="empty">无法加载插件页面：缺少 AstrBot 页面桥接（请通过 AstrBot WebUI 打开）。</div>';
      throw new Error('AstrBot plugin page bridge is missing');
    }
    await bridge.ready();

    const $ = (id) => document.getElementById(id);
    const toastEl = $('toast');
    const statsEl = $('stats');
    const privateWrap = $('privateWrap');
    const groupWrap = $('groupWrap');
    const searchInput = $('search');
    const marketEl = $('market');
    const investStatsEl = $('investStats');
    const investTableWrap = $('investTableWrap');
    const feeHint = $('feeHint');

    const state = {
      view: 'users',
      users: [],
      meta: { today_tokens_sum: 0, total_tokens_sum: 0 },
      keyword: '',
      history: [],
      usersLoaded: false,
      investLoaded: false,
      pendingDelete: null,
    };

    function toast(msg, isError = false) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }
    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value == null ? '' : String(value);
      return div.innerHTML;
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmtTokens(n) {
      n = Number(n) || 0;
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return String(n);
    }

    function setView(view) {
      state.view = view === 'invest' ? 'invest' : 'users';
      document.querySelectorAll('.tab').forEach((tab) => {
        const active = tab.dataset.view === state.view;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      $('view-users').hidden = state.view !== 'users';
      $('view-invest').hidden = state.view !== 'invest';
      $('subtitle').textContent = state.view === 'users'
        ? '用户额度与用量'
        : '今日模拟行情 · 每日 0 点更新';
      history.replaceState(null, '', '#' + state.view);
      if (state.view === 'users' && !state.usersLoaded) loadUsers();
      if (state.view === 'invest' && !state.investLoaded) loadInvest();
    }

    async function loadUsers() {
      privateWrap.innerHTML = '<div class="empty">加载中…</div>';
      groupWrap.innerHTML = '<div class="empty">加载中…</div>';
      try {
        const res = await bridge.apiGet('users');
        state.users = res.users || [];
        state.meta = {
          today_tokens_sum: res.today_tokens_sum || 0,
          total_tokens_sum: res.total_tokens_sum || 0,
        };
        state.usersLoaded = true;
        renderUserStats();
        renderUserTables();
      } catch (e) {
        privateWrap.innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message || e)}</div>`;
        groupWrap.innerHTML = '';
      }
    }

    function renderUserStats() {
      const users = state.users;
      const usedSum = users.reduce((s, u) => s + (Number(u.total_used) || 0), 0);
      const remainSum = users.reduce((s, u) => s + (Number(u.remaining) || 0), 0);
      const items = [
        ['用户总数', users.length],
        ['累积调用', usedSum],
        ['剩余总次数', remainSum],
        ['累积 Token', fmtTokens(state.meta.total_tokens_sum)],
        ['今日 Token', fmtTokens(state.meta.today_tokens_sum)],
      ];
      statsEl.innerHTML = items.map(([label, value]) => `
        <div class="stat"><div class="label">${label}</div><div class="value">${escapeHtml(value)}</div></div>
      `).join('');
    }

    function userMatches(u, keyword) {
      if (!keyword) return true
      const parts = [u.user_id, u.name || ''];
      (u.groups || []).forEach((g) => parts.push(g.group_id, g.name || ''));
      return parts.join(' ').toLowerCase().includes(keyword);
    }

    function userCells(u, displayName, extra) {
      const label = displayName || u.name || u.user_id;
      return `
        <td class="uid">${escapeHtml(u.user_id)}</td>
        <td>${escapeHtml(displayName || '—')}${u.is_admin ? ' <span class="muted">管理员</span>' : ''}</td>
        ${extra}
        <td><input class="qty td-remain" data-uid="${escapeAttr(u.user_id)}" value="${Number(u.remaining) || 0}" inputmode="numeric" autocomplete="off" /></td>
        <td class="num">${Number(u.today_used) || 0}</td>
        <td class="num">${Number(u.total_used) || 0}</td>
        <td class="num">${fmtTokens(u.total_tokens)}</td>
        <td><button class="btn btn-sm btn-del" type="button"
              data-uid="${escapeAttr(u.user_id)}"
              data-label="${escapeAttr(label)}">删除</button></td>`;
    }

    function renderUserTables() {
      const keyword = state.keyword;
      const users = state.users.filter((u) => userMatches(u, keyword));

      const privateRows = users
        .filter((u) => (u.private && u.private.last) || !(u.groups || []).length)
        .sort((a, b) => (Number(b.total_tokens) || 0) - (Number(a.total_tokens) || 0))
        .map((u) => `<tr data-uid="${escapeAttr(u.user_id)}">
          ${userCells(u, (u.private && u.private.name) || u.name, `<td class="muted">${escapeHtml(u.private && u.private.last ? u.private.last.replace('T', ' ') : '—')}</td>`)}
        </tr>`)
        .join('');

      const groupRows = [];
      users.forEach((u) => {
        (u.groups || []).forEach((g) => {
          groupRows.push(`<tr data-uid="${escapeAttr(u.user_id)}">
            ${userCells(u, g.name || u.name, `<td class="uid">${escapeHtml(g.group_id)}</td>`)}
          </tr>`);
        });
      });

      privateWrap.innerHTML = privateRows
        ? `<table>
            <thead><tr>
              <th>QQ 号</th><th>昵称</th><th>最近私聊</th><th>剩余次数</th>
              <th>今日调用</th><th>累积调用</th><th>累积 Token</th><th>操作</th>
            </tr></thead>
            <tbody>${privateRows}</tbody>
          </table>`
        : `<div class="empty">${state.users.length ? '没有匹配的私聊记录' : '暂无私聊记录'}</div>`;

      groupWrap.innerHTML = groupRows.length
        ? `<table>
            <thead><tr>
              <th>QQ 号</th><th>昵称</th><th>群号</th><th>剩余次数</th>
              <th>今日调用</th><th>累积调用</th><th>累积 Token</th><th>操作</th>
            </tr></thead>
            <tbody>${groupRows.join('')}</tbody>
          </table>`
        : `<div class="empty">${state.users.length ? '没有匹配的群聊记录' : '暂无群聊记录'}</div>`;

      $('privateCount').textContent = privateRows ? `（${privateRows.split('<tr').length - 1}）` : '';
      $('groupCount').textContent = groupRows.length ? `（${groupRows.length}）` : '';

      [privateWrap, groupWrap].forEach((wrap) => {
        wrap.querySelectorAll('.qty').forEach((input) => {
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            if (e.key === 'Escape') { e.preventDefault(); restoreQuotaInput(input); }
          });
          input.addEventListener('blur', () => saveQuota(input));
        });
        wrap.querySelectorAll('.btn-del').forEach((btn) => {
          btn.addEventListener('click', () => openDeleteModal(btn.dataset.uid, btn.dataset.label));
        });
      });
    }

    function userQuota(u) {
      return Number(u && u.remaining) || 0;
    }

    function syncQuotaInputs(uid, remaining) {
      [privateWrap, groupWrap].forEach((wrap) => {
        wrap.querySelectorAll(`.qty[data-uid="${CSS.escape(String(uid))}"]`).forEach((input) => {
          input.value = remaining;
        });
      });
    }

    function restoreQuotaInput(input) {
      const target = state.users.find((u) => String(u.user_id) === String(input.dataset.uid));
      input.value = userQuota(target);
    }

    async function saveQuota(input) {
      if (input.dataset.busy === '1') return;
      const uid = input.dataset.uid;
      const target = state.users.find((u) => String(u.user_id) === String(uid));
      const current = userQuota(target);
      const raw = String(input.value || '').trim();
      if (!/^\d+$/.test(raw)) {
        restoreQuotaInput(input);
        toast('请输入 0 或正整数', true);
        return;
      }
      const next = Number(raw);
      if (!Number.isSafeInteger(next)) {
        restoreQuotaInput(input);
        toast('数字超出范围', true);
        return;
      }
      if (next === current) {
        restoreQuotaInput(input);
        return;
      }
      input.dataset.busy = '1';
      input.classList.add('saving');
      try {
        const res = await bridge.apiGet(`update/${uid}/${next}`);
        const remaining = Number(res.remaining);
        if (target) target.remaining = remaining;
        syncQuotaInputs(uid, remaining);
        renderUserStats();
        toast('已更新');
      } catch (e) {
        restoreQuotaInput(input);
        toast(`操作失败：${e.message || e}`, true);
      } finally {
        input.dataset.busy = '0';
        input.classList.remove('saving');
      }
    }

    async function loadInvest() {
      investTableWrap.innerHTML = '<div class="empty">加载中…</div>';
      try {
        const [market, invest] = await Promise.all([
          bridge.apiGet('market'),
          bridge.apiGet('investments'),
        ]);
        renderMarket(market || {});
        state.history = (invest && invest.investments) || [];
        state.investLoaded = true;
        renderInvestStats();
        renderInvestTable();
      } catch (e) {
        investTableWrap.innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message || e)}</div>`;
      }
    }

    function renderMarket(data) {
      const assets = data.assets || [];
      if (state.view === 'invest' && data.date) {
        $('subtitle').textContent = `${data.date} · 模拟行情，仅供娱乐`;
      }
      feeHint.textContent = Number(data.fee_percent) > 0
        ? `手续费 ${data.fee_percent}%`
        : '免手续费';

      if (!assets.length) {
        marketEl.innerHTML = '<div class="empty">暂无行情数据</div>';
        return;
      }
      marketEl.innerHTML = assets.map((a) => {
        const change = Number(a.change_percent) || 0;
        const cls = change >= 0 ? 'pos' : 'neg';
        const sign = change >= 0 ? '+' : '';
        return `<div class="asset">
          <div class="name">${escapeHtml(a.name)}</div>
          <div class="price">${Number(a.price).toFixed(2)}</div>
          <div class="base">基准价 ${escapeHtml(a.base)}</div>
          <span class="badge ${cls}">${sign}${change.toFixed(2)}%</span>
        </div>`;
      }).join('');
    }

    function renderInvestStats() {
      const history = state.history;
      const users = new Set(history.map((h) => h.user_id)).size;
      const stakeSum = history.reduce((s, h) => s + (Number(h.stake) || 0), 0);
      const pnlSum = history.reduce((s, h) => s + (Number(h.pnl) || 0), 0);
      const items = [
        ['投资笔数', history.length, ''],
        ['参与用户', users, ''],
        ['累计投入', stakeSum, ''],
        ['累计盈亏', `${pnlSum >= 0 ? '+' : ''}${pnlSum}`, pnlSum >= 0 ? 'pos' : 'neg'],
      ];
      investStatsEl.innerHTML = items.map(([label, value, cls]) => `
        <div class="stat"><div class="label">${label}</div><div class="value ${cls}">${escapeHtml(value)}</div></div>
      `).join('');
    }

    function renderInvestTable() {
      const history = state.history;
      if (!history.length) {
        investTableWrap.innerHTML = '<div class="empty">暂无投资记录，去群里发 /投资 试试吧</div>';
        return;
      }
      const rows = history.map((item) => {
        const pnl = Number(item.pnl) || 0;
        const pnlCls = pnl >= 0 ? 'pos' : 'neg';
        const rate = Number(item.rate) || 0;
        const rateText = `${rate >= 0 ? '+' : ''}${(rate * 100).toFixed(2)}%`;
        const time = String(item.time || '').replace('T', ' ');
        const fee = Number(item.fee) || 0;
        return `<tr>
          <td class="muted">${escapeHtml(time)}</td>
          <td>${escapeHtml(item.nickname || item.user_id || '')}<div class="uid muted">${escapeHtml(item.user_id || '')}</div></td>
          <td>${escapeHtml(item.asset || '')}</td>
          <td class="num">${escapeHtml(item.percent)}%</td>
          <td class="num">${escapeHtml(item.stake)}</td>
          <td class="num ${rate >= 0 ? 'pos' : 'neg'}">${escapeHtml(rateText)}</td>
          <td class="num ${pnlCls}">${pnl >= 0 ? '+' : ''}${pnl}</td>
          <td class="num muted">${fee ? fee : '—'}</td>
          <td class="num">${escapeHtml(item.balance_before)} → ${escapeHtml(item.balance_after)}</td>
        </tr>`;
      }).join('');

      investTableWrap.innerHTML = `<table>
        <thead><tr>
          <th>时间</th><th>用户</th><th>币种</th><th>投入比例</th><th>投入次数</th>
          <th>今日行情</th><th>盈亏</th><th>手续费</th><th>余额变化</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    async function refresh() {
      if (state.view === 'users') { await loadUsers(); }
      else { await loadInvest(); }
      toast('已刷新');
    }

    async function postAction(name) {
      if (typeof bridge.apiPost === 'function') return bridge.apiPost(name, {});
      return bridge.apiGet(name);
    }

    const clearModal = $('clearModal');
    const clearConfirmInput = $('clearConfirmInput');
    const clearConfirm = $('clearConfirm');

    function openClearModal() {
      clearConfirmInput.value = '';
      clearConfirm.disabled = true;
      clearModal.hidden = false;
      clearConfirmInput.focus();
    }
    function closeClearModal() {
      clearModal.hidden = true;
    }

    async function clearAllData() {
      clearConfirm.disabled = true;
      try {
        await postAction('clear_all');
        closeClearModal();
        state.users = [];
        state.meta = { today_tokens_sum: 0, total_tokens_sum: 0 };
        state.history = [];
        state.usersLoaded = false;
        state.investLoaded = false;
        privateWrap.innerHTML = '<div class="empty">加载中…</div>';
        groupWrap.innerHTML = '<div class="empty">加载中…</div>';
        await loadUsers();
        toast('全部数据已清空');
      } catch (e) {
        clearConfirm.disabled = clearConfirmInput.value.trim() !== '清空';
        toast(`清空失败：${e.message || e}`, true);
      }
    }

    $('btnClearAll').addEventListener('click', openClearModal);
    $('clearCancel').addEventListener('click', closeClearModal);
    clearModal.addEventListener('click', (e) => { if (e.target === clearModal) closeClearModal(); });
    clearConfirmInput.addEventListener('input', () => {
      clearConfirm.disabled = clearConfirmInput.value.trim() !== '清空';
    });
    clearConfirmInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && clearConfirmInput.value.trim() === '清空') clearAllData();
      if (e.key === 'Escape') closeClearModal();
    });
    clearConfirm.addEventListener('click', clearAllData);

    // ── 删除单个用户 ──
    const delUserModal = $('delUserModal');
    const delUserText = $('delUserText');

    function openDeleteModal(uid, label) {
      state.pendingDelete = String(uid);
      delUserText.innerHTML = `将删除「${escapeHtml(label || uid)}」（${escapeHtml(uid)}）的额度、签到、调用统计、Token、投资记录与昵称档案，且无法恢复。`;
      delUserModal.hidden = false;
    }
    function closeDeleteModal() {
      delUserModal.hidden = true;
      state.pendingDelete = null;
    }
    async function confirmDeleteUser() {
      const uid = state.pendingDelete;
      if (!uid) return;
      $('delConfirm').disabled = true;
      try {
        await bridge.apiGet(`users/${encodeURIComponent(uid)}/delete`);
        closeDeleteModal();
        state.users = state.users.filter((u) => String(u.user_id) !== uid);
        renderUserStats();
        renderUserTables();
        toast('用户数据已删除');
      } catch (e) {
        toast(`删除失败：${e.message || e}`, true);
      } finally {
        $('delConfirm').disabled = false;
      }
    }
    $('delCancel').addEventListener('click', closeDeleteModal);
    delUserModal.addEventListener('click', (e) => { if (e.target === delUserModal) closeDeleteModal(); });
    $('delConfirm').addEventListener('click', confirmDeleteUser);

    // ── 分区折叠（状态记在 localStorage） ──
    const COLLAPSE_KEY = 'limit_use_sections_collapsed';

    function readCollapsed() {
      try {
        return JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}') || {};
      } catch (e) {
        return {};
      }
    }
    function applyCollapsed() {
      const collapsed = readCollapsed();
      document.querySelectorAll('.panel-head .toggle').forEach((btn) => {
        const panel = btn.closest('.panel');
        const isCollapsed = !!collapsed[btn.dataset.panel];
        panel.classList.toggle('collapsed', isCollapsed);
        btn.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
      });
    }
    document.querySelectorAll('.panel-head .toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const panel = btn.closest('.panel');
        const collapsed = readCollapsed();
        const next = !panel.classList.contains('collapsed');
        panel.classList.toggle('collapsed', next);
        btn.setAttribute('aria-expanded', next ? 'false' : 'true');
        collapsed[btn.dataset.panel] = next;
        try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); } catch (e) { /* 忽略 */ }
      });
    });

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => setView(tab.dataset.view));
    });
    searchInput.addEventListener('input', () => {
      state.keyword = searchInput.value.trim().toLowerCase();
      renderUserTables();
    });
    $('btnRefresh').addEventListener('click', refresh);

    applyCollapsed();
    setView(location.hash === '#invest' ? 'invest' : 'users');
  </script>
</body>
</html>
